# Verifies the exact published head, as DEVELOPMENT.md requires:
#   "CI verifies the exact published head."
#   "Merge always requires an explicit decision from a current maintainer."
# This workflow reports status. It merges nothing.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The least privilege needed to read the code and report status.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install ruff
        run: pipx install ruff

      - name: lint
        run: ruff check .

      - name: format
        run: ruff format --check .

      # Fanger syntaksfeil uten å starte tjenesten.
      - name: compile
        run: python -m compileall -q .

      - name: check
        run: python check.py

      # SECURITY.md: external SQLite sources are opened read-only. Axey's own
      # observation store is a writable, owned store and is not covered here.
      - name: verify read-only source access
        run: |
          if grep -nE '\b(INSERT|UPDATE|DELETE|DROP|ALTER)\b' source_readers.py; then
            echo "::error::writing SQL found — source readers must be read-only"
            exit 1
          fi
          if ! grep -q 'mode=ro' source_readers.py; then
            echo "::error::no mode=ro in source_readers.py — connections must be read-only"
            exit 1
          fi
          echo "read-only confirmed"
