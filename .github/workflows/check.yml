# Verifies the exact published head, as DEVELOPMENT.md requires:
#   "CI verifies the exact published head."
#   "Merge always requires an explicit decision from a current maintainer."
# This workflow reports status. It merges nothing.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The least privilege needed to read the code and report status.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The repository holds specifications until the implementation lands.
      # Report success rather than inventing a verdict about nothing.
      - name: detect implementation
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no implementation yet — specifications only"
          fi

      - name: install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: check
        if: steps.detect.outputs.present == 'true'
        run: npm run check
