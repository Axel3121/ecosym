<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecosym — orbis</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<!--
THESIS: A kept chart, not a dashboard. Civilizations are places you descend into; the same ink thickens from coastline to rooftop to walking figure. It refuses the node-graph-plus-side-panel arrangement.
OWN-WORLD: vellum #d9c49a under raking light, iron-gall ink #3b2a1a, one seal red #9c3524 earned only by petitions and council matters, IM Fell English marginalia, Alegreya sheets. Unobserved is bare skin, never grey.
STORY: Axel opens the chart, sees which places are inked and which are bare, reads the Capital's docket, descends into a settlement, watches who is working, and addresses the seat with a petition that is drawn as a letter, never as a result.
FIRST VIEWPORT: full-bleed vellum; four coasts around a central compass-citadel; one cartouche upper-left; the Capital's docket as marginalia lower-right; ink routes only where a border was crossed. Primary action: click a place.
FORM: Treasure chart fused with Civitates engraving and the byōbu's cloud-as-unknown; user-pinned over the roll (seed key b0f9c328).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div id="app">
    <aside id="desk" class="desk" aria-label="Arbeidsbord">
      <header class="desk-head">
        <div class="desk-title"><h1>Ecosym</h1><span class="modes" role="group" aria-label="Bordets modus"><button class="toggle" data-mode="collapsed" title="Skjul bordet (⌥B)">«</button><button class="toggle" data-mode="side" title="Ved siden av kartet">▮▯</button><button class="toggle" data-mode="full" title="Fullskjerm (⌥F)">⛶</button></span><button class="show-map" data-mode="side">‹ vis kart</button></div>
        <p class="sub">observert <span id="observed-at"></span></p>
        <p class="synthetic" id="synthetic" hidden>syntetisk fixture — ingenting her er observert</p>
      </header>
      <nav id="desk-tabs" class="tabs" aria-label="Faner"></nav>
      <div id="desk-body"></div>
    </aside>
    <main id="stage">
    <canvas id="chart" tabindex="0" aria-label="Verdenskart"></canvas>
    <div id="hover" class="hover panel" hidden></div>
    <section id="focus" class="focus panel" hidden aria-live="polite">
      <div class="focus-side">
        <button class="back" id="focus-back">← tilbake til verden <kbd>Esc</kbd></button>
        <div class="portrait" id="focus-portrait"></div>
        <h2 id="focus-name"></h2>
        <p class="kind" id="focus-kind"></p>
        <div id="focus-facts" class="facts"></div>
      </div>
      <div class="focus-main">
        <div class="thread" id="focus-thread"></div>
        <form id="focus-form" class="ask">
          <input id="focus-input" type="text" autocomplete="off" placeholder="skriv til dem…" />
          <button type="submit">Send</button>
        </form>
      </div>
    </section>
    <p class="hint panel" id="hint">scroll for å gå ned · klikk et sted · dra for å panorere · 1–4 sivilisasjon · C Capital</p>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
