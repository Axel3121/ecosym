<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecosym — orbis</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/shell.css" />
</head>
<body>
<!--
THESIS: The map is the navigation. There is no menu. One strip at the bottom says
the whole world in a sentence; its numbers are the only links. One sheet appears
beside the map when you choose something, and leaves when you do not. One command
line for what a click cannot do: ja, nei, spør, snakk.
-->
  <div id="app">
    <main id="stage">
      <canvas id="chart" tabindex="0" aria-label="Verdenskart"></canvas>
      <div id="hover" class="hover panel" hidden></div>

      <!-- the sheet: context for what you chose; never a permanent panel -->
      <aside id="sheet" class="sheet" hidden aria-live="polite">
        <div class="sheet-head"><span id="sheet-title"></span><button id="sheet-close" class="quiet" aria-label="Lukk">✕</button></div>
        <div id="sheet-body"></div>
      </aside>

      <!-- focus mode: leave the world, talk -->
      <section id="focus" class="focus panel" hidden aria-live="polite">
        <div class="focus-side">
          <button class="back" id="focus-back">← tilbake til verden <kbd>Esc</kbd></button>
          <div class="portrait" id="focus-portrait"></div>
          <h2 id="focus-name"></h2>
          <p class="kind" id="focus-kind"></p>
          <div id="focus-facts" class="facts"></div>
        </div>
        <div class="focus-main">
          <div class="thread" id="focus-thread"></div>
          <form id="focus-form" class="ask">
            <input id="focus-input" type="text" autocomplete="off" placeholder="skriv til dem…" />
            <button type="submit">Send</button>
          </form>
        </div>
      </section>

      <!-- the strip: the world in one sentence, numbers are links; the command line lives in it -->
      <footer id="strip" class="strip">
        <span class="brand">Ecosym</span>
        <span id="strip-text" class="strip-text"></span>
        <form id="cmd" class="cmd" autocomplete="off">
          <input id="cmd-input" type="text" placeholder="/ for å skrive: ja · nei · spør · snakk curia · roma" aria-label="Kommando" />
          <ul id="cmd-suggest" class="cmd-suggest" hidden></ul>
        </form>
        <details class="more"><summary aria-label="Flere valg">•••</summary>
          <div class="more-menu">
            <button data-sheet="innstillinger">Innstillinger</button>
            <button data-sheet="observert">Logg</button>
          </div>
        </details>
      </footer>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
